<script>
// Web port: scale the 4:3 (640x480) canvas to fit the window or the fullscreen
// screen while preserving the aspect ratio (letterboxed with black bars).
// Without this the canvas is pinned to a fixed 640x480 and never responds to
// the window size. It also re-fits after fullscreen changes, so switching
// Fullscreen -> Window cannot leave the canvas stretched/squashed ("变扁").
(function () {
  var BASE_W = 640, BASE_H = 480;
  function fitCanvasToViewport() {
    try {
      var c = document.getElementById('canvas');
      var root = document.documentElement;
      if (!c || !root) return;
      // When the page itself is fullscreen, innerWidth/innerHeight already
      // report the full screen, so this covers both windowed and fullscreen.
      var vw = window.innerWidth || (window.screen && window.screen.width) || BASE_W;
      var vh = window.innerHeight || (window.screen && window.screen.height) || BASE_H;
      if (!vw || !vh) return;
      var scale = Math.min(vw / BASE_W, vh / BASE_H);
      if (!isFinite(scale) || scale <= 0) scale = 1;
      var w = Math.max(160, Math.round(BASE_W * scale));
      var h = Math.max(120, Math.round(BASE_H * scale));
      root.style.setProperty('--touhou-canvas-width', w + 'px');
      root.style.setProperty('--touhou-canvas-height', h + 'px');
      // Safety net: never distort the bitmap even if UA rules resize the canvas.
      c.style.objectFit = 'contain';
    } catch (e) {}
  }
  window.fitCanvasToViewport = fitCanvasToViewport;
  fitCanvasToViewport();
  window.addEventListener('load', fitCanvasToViewport);
  window.addEventListener('resize', fitCanvasToViewport);
  window.addEventListener('orientationchange', function () { setTimeout(fitCanvasToViewport, 120); });
  document.addEventListener('fullscreenchange', function () { setTimeout(fitCanvasToViewport, 60); });
  document.addEventListener('webkitfullscreenchange', function () { setTimeout(fitCanvasToViewport, 60); });
})();
</script>
<script>
// Preload bgm/*.flac into MEMFS so WAV mode (FLAC playback) works
// Uses the runtime's FS_createPath/FS_createDataFile exports (available in preRun),
// NOT Module.FS (which is not assigned yet at preRun time).
Module = Module || {};
Module.preRun = Module.preRun || [];
Module.preRun.push(function() {
    var total = 17, done = 0;
    if (typeof Module.addRunDependency === 'function') Module.addRunDependency('web-bgm');
    // The game BLOCKS on this run dependency, and the 17 FLACs are by far the
    // biggest thing transferred after th06.data. Without a status line the
    // player just sees the network busy with no explanation, and whatever
    // message was on screen (usually the data-file counter) stays frozen.
    function bgmStatus() {
        if (typeof Module.setStatus === 'function') {
            Module.setStatus('Loading music... (' + done + '/' + total + ')');
        }
    }
    function fin() {
        done++;
        bgmStatus();
        if (done >= total) {
            if (typeof Module.removeRunDependency === 'function') Module.removeRunDependency('web-bgm');
            console.log('[bgm] all FLACs loaded into MEMFS');
        }
    }
    bgmStatus();
    try {
        if (typeof Module.FS_createPath === 'function') Module.FS_createPath('/', 'bgm', true, true);
    } catch(e) { console.warn('[bgm] mkdir: ' + e.message); }
    for (var i = 1; i <= 17; i++) {
        (function(num) {
            var n = (num < 10 ? '0' : '') + num;
            var url = 'bgm/th06_' + n + '.flac';
            fetch(url).then(function(r) { return r.ok ? r.arrayBuffer() : null; })
                .then(function(buf) {
                    if (buf) {
                        try {
                            if (typeof Module.FS_createDataFile === 'function') {
                                Module.FS_createDataFile('/bgm', 'th06_' + n + '.flac', new Uint8Array(buf), true, true, true);
                            } else {
                                Module.FS.writeFile('/bgm/th06_' + n + '.flac', new Uint8Array(buf));
                            }
                        } catch(e) { console.warn('[bgm] write fail th06_' + n + '.flac: ' + e.message); }
                    } else { console.warn('[bgm] missing ' + url); }
                    fin();
                })
                .catch(function(e) { console.warn('[bgm] fetch fail ' + url + ': ' + e.message); fin(); });
        })(i);
    }
});
</script>
<script>
// Web port: restore the persisted MODE (fullscreen / window) and FPS settings.
// Stored in localStorage so the choice survives reloads and restarts.
// Module.eaglerOptions is defined by the shell above; the runtime reads
// limitPresentationTo60 every frame, so setting it here takes effect
// immediately at startup.
(function(){
  var LS_FULLSCREEN = 'th06.fullscreen';   // '1' fullscreen | '0' window
  var LS_FPS = 'th06.fps';                 // '60' | 'unlimited'

  function read(key, fallback) {
    try { var v = localStorage.getItem(key); return (v === null || v === undefined) ? fallback : v; }
    catch (e) { return fallback; }
  }
  function write(key, value) { try { localStorage.setItem(key, value); } catch (e) {} }

  // ---- FPS: default 60 (original one picture per simulation tick) ----
  try {
    if (!window.Module) window.Module = {};
    if (!window.Module.eaglerOptions) window.Module.eaglerOptions = {};
    window.Module.eaglerOptions.limitPresentationTo60 = (read(LS_FPS, '60') !== 'unlimited');
  } catch (e) {}

  // ---- MODE: the stored value is the user's PREFERENCE, not the live state ----
  //
  // This used to mirror the live state into localStorage on every
  // fullscreenchange. That broke MODE: anything that programmatically left
  // fullscreen (the quit path, this file's own startup apply) fired the event
  // and was written down as "the user chose Window", so the next launch came up
  // windowed no matter what the menu said.
  //
  // Now only *user* fullscreen changes are recorded - the shell suppresses the
  // event while it is applying a change itself. That keeps "press Esc to leave
  // fullscreen" updating the preference while making programmatic changes
  // invisible to it.
  var isFull = function () {
    return !!(document.fullscreenElement || document.webkitFullscreenElement);
  };
  window.__th06FullscreenSync = true; // consulted by every script on the page
  var syncStored = function () {
    if (!window.__th06FullscreenSync) return;
    write(LS_FULLSCREEN, isFull() ? '1' : '0');
  };
  document.addEventListener('fullscreenchange', syncStored);
  document.addEventListener('webkitfullscreenchange', syncStored);

  var refit = function () {
    try { if (typeof window.fitCanvasToViewport === 'function') setTimeout(window.fitCanvasToViewport, 60); } catch (e) {}
  };

  // Run a programmatic fullscreen change without letting it overwrite the
  // stored preference. The event is async, so the flag stays down briefly.
  function withoutRecording(fn) {
    window.__th06FullscreenSync = false;
    try { fn(); } catch (e) {}
    setTimeout(function () { window.__th06FullscreenSync = true; }, 800);
  }
  window.__th06WithoutRecordingFullscreen = withoutRecording;

  function applyFullscreenPreference() {
    var want = read(LS_FULLSCREEN, '0') === '1';
    withoutRecording(function () {
    try {
      if (want && !isFull()) {
        var el = document.documentElement;
        var p = el.requestFullscreen ? el.requestFullscreen()
              : (el.webkitRequestFullscreen ? el.webkitRequestFullscreen() : null);
        if (p && typeof p.then === 'function') p.then(refit, refit); else refit();
      } else if (!want && isFull()) {
        var q = document.exitFullscreen ? document.exitFullscreen()
              : (document.webkitExitFullscreen ? document.webkitExitFullscreen() : null);
        if (q && typeof q.then === 'function') q.then(refit, refit); else refit();
      }
    } catch (e) {}
    });
  }

  // requestFullscreen() requires a user gesture, so the stored preference is
  // applied on the first click / key press once the player is actually here.
  var applied = false;
  var onFirstGesture = function () {
    if (applied) return;
    applied = true;
    window.removeEventListener('pointerdown', onFirstGesture, true);
    window.removeEventListener('keydown', onFirstGesture, true);
    applyFullscreenPreference();
  };
  window.addEventListener('pointerdown', onFirstGesture, true);
  window.addEventListener('keydown', onFirstGesture, true);
})();

// Web port: make the th06.data progress readout honest.
//
// th06.js renders the counter as `(loaded/total)`, where `total` comes from the
// response's Content-Length and `loaded` counts DECODED bytes. When the page is
// served with Content-Encoding (gzip/br) - which hosted/preview servers do -
// Content-Length is the COMPRESSED size, so `total` is much smaller than the
// real file (e.g. 12698072 vs 17014602). The readout then looks like it hits
// 100% about three quarters of the way through and afterwards shows a nonsense
// "17014602/12698072" that never moves again, even though bytes are still
// arriving.
//
// Rewrite it as MB against max(loaded, total). That is monotonic and correct
// whether or not the response is compressed.

    // "Running... (3/5)" and the BGM preloader as "Loading music... (7/17)" -
    // rewriting those would turn them into nonsense byte counts.
    if (text.indexOf(PREFIX) !== 0) return text;
    return text.replace(COUNTER, function (whole, a, b) {

        var tx = db.transaction(STORE, "readonly");
        var req = tx.objectStore(STORE).openKeyCursor();
        req.onsuccess = function (e) {
          var cur = e.target.result;
          if (cur) { if (cur.key.indexOf(REPLAY_DIR + "/") === 0 && /\.(rpy|rpyx)$/i.test(cur.key)) out.push(cur.key); cur.continue(); }
        };
        tx.oncomplete = function () { db.close(); resolve(out); };
        tx.onerror = function () { db.close(); reject(tx.error); };
      });
    }).then(function (list) {
      var ul = $("env-replist");
      ul.innerHTML = "";
      if (list.length === 0) { log(t("listEmpty")); return; }
      for (var i = 0; i < list.length; i++) {
        (function (key) {
          var li = document.createElement("li");
          var span = document.createElement("span");
          span.className = "name"; span.textContent = key.slice(REPLAY_DIR.length + 1);
          var btn = document.createElement("button");
          btn.className = "env-danger"; btn.textContent = lang === "ja" ? "削除" : "删除";
          btn.onclick = function () { deleteReplay(key); };
          li.appendChild(span); li.appendChild(btn);
          ul.appendChild(li);
        })(list[i]);
      }
    }).catch(function (err) { log(t("listErr")(err), "err"); });
  }
  $("env-injectBtn").addEventListener("click", injectReplay);
  $("env-refreshBtn").addEventListener("click", refreshList);

  // ---- toggle + init ----
  $("env-lang").addEventListener("change", function (e) { lang = e.target.value; applyLang(); });
  $("th06env-toggle").addEventListener("click", function () { $("th06env-panel").hidden = !$("th06env-panel").hidden; });
  applyLang();
  refreshList();
})();
</script>

</body></html>
